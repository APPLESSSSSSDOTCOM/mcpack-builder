<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        #todoInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        #todoInput:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #addBtn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #addBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        #addBtn:active {
            transform: translateY(0);
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        #clearBtn {
            padding: 8px 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        #clearBtn:hover {
            background: #ff5252;
        }
        
        .home-btn {
            padding: 8px 15px;
            background: #4ecdc4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }
        
        .home-btn:hover {
            background: #45b8af;
        }
        
        #todoList {
            list-style: none;
        }
        
        .todo-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }
        
        .todo-item:hover {
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .todo-item.completed {
            opacity: 0.6;
            border-left-color: #4caf50;
        }
        
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        
        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .todo-text {
            flex: 1;
            color: #333;
            font-size: 1em;
            word-break: break-word;
        }
        
        .todo-actions {
            display: flex;
            gap: 8px;
        }
        
        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 0.9em;
        }
        
        .delete-btn:hover {
            background: #ff5252;
        }
        
        .edit-btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 0.9em;
        }
        
        .edit-btn:hover {
            background: #45b8af;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 1.1em;
        }
        
        .stats {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            color: #333;
            margin-top: 20px;
            font-size: 0.95em;
        }
        
        .edit-container {
            display: none;
            gap: 8px;
            flex: 1;
        }
        
        .edit-container.active {
            display: flex;
        }
        
        .edit-input {
            flex: 1;
            padding: 8px;
            border: 2px solid #667eea;
            border-radius: 4px;
            font-size: 0.95em;
        }
        
        .save-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 0.9em;
        }
        
        .save-btn:hover {
            background: #45a049;
        }
        
        .cancel-btn {
            background: #999;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 0.9em;
        }
        
        .cancel-btn:hover {
            background: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 To-Do List</h1>
        
        <div class="input-container">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button id="addBtn">Add</button>
        </div>
        
        <div class="controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button id="clearBtn">Clear Completed</button>
            <a href="index.html" class="home-btn">🏠 Home</a>
        </div>
        
        <ul id="todoList"></ul>
        
        <div class="empty-state" id="emptyState">
            No tasks yet. Add one to get started!
        </div>
        
        <div class="stats" id="stats"></div>
    </div>

    <script>
        // TodoApp with Local Storage
        const TodoApp = {
            todos: [],
            currentFilter: 'all',
            editingId: null,

            init() {
                this.loadFromStorage();
                this.setupEventListeners();
                this.render();
            },

            setupEventListeners() {
                document.getElementById('addBtn').addEventListener('click', () => this.addTodo());
                document.getElementById('todoInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTodo();
                });
                document.getElementById('clearBtn').addEventListener('click', () => this.clearCompleted());
                
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFilter = e.target.dataset.filter;
                        this.render();
                    });
                });
            },

            addTodo() {
                const input = document.getElementById('todoInput');
                const text = input.value.trim();
                
                if (!text) {
                    alert('Please enter a task!');
                    return;
                }
                
                const todo = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toLocaleString()
                };
                
                this.todos.push(todo);
                input.value = '';
                this.saveToStorage();
                this.render();
            },

            deleteTodo(id) {
                this.todos = this.todos.filter(todo => todo.id !== id);
                this.saveToStorage();
                this.render();
            },

            toggleTodo(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    this.saveToStorage();
                    this.render();
                }
            },

            startEdit(id) {
                this.editingId = id;
                this.render();
            },

            saveEdit(id, newText) {
                const text = newText.trim();
                if (!text) {
                    alert('Task cannot be empty!');
                    return;
                }
                
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.text = text;
                    this.editingId = null;
                    this.saveToStorage();
                    this.render();
                }
            },

            cancelEdit() {
                this.editingId = null;
                this.render();
            },

            clearCompleted() {
                if (confirm('Are you sure you want to delete all completed tasks?')) {
                    this.todos = this.todos.filter(todo => !todo.completed);
                    this.saveToStorage();
                    this.render();
                }
            },

            getFilteredTodos() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.todos.filter(todo => !todo.completed);
                    case 'completed':
                        return this.todos.filter(todo => todo.completed);
                    default:
                        return this.todos;
                }
            },

            saveToStorage() {
                localStorage.setItem('todos', JSON.stringify(this.todos));
            },

            loadFromStorage() {
                const stored = localStorage.getItem('todos');
                this.todos = stored ? JSON.parse(stored) : [];
            },

            render() {
                const todoList = document.getElementById('todoList');
                const emptyState = document.getElementById('emptyState');
                const stats = document.getElementById('stats');
                
                const filteredTodos = this.getFilteredTodos();
                
                todoList.innerHTML = '';
                
                if (this.todos.length === 0) {
                    emptyState.style.display = 'block';
                    stats.innerHTML = '';
                } else {
                    emptyState.style.display = 'none';
                    
                    filteredTodos.forEach(todo => {
                        const li = document.createElement('li');
                        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                        
                        if (this.editingId === todo.id) {
                            li.innerHTML = `
                                <div class="edit-container active">
                                    <input 
                                        type="text" 
                                        class="edit-input" 
                                        value="${todo.text}"
                                        id="editInput"
                                    >
                                    <button class="save-btn">Save</button>
                                    <button class="cancel-btn">Cancel</button>
                                </div>
                            `;
                            
                            const saveBtn = li.querySelector('.save-btn');
                            const cancelBtn = li.querySelector('.cancel-btn');
                            const editInput = li.querySelector('#editInput');
                            
                            saveBtn.addEventListener('click', () => {
                                this.saveEdit(todo.id, editInput.value);
                            });
                            
                            cancelBtn.addEventListener('click', () => {
                                this.cancelEdit();
                            });
                            
                            editInput.addEventListener('keypress', (e) => {
                                if (e.key === 'Enter') {
                                    this.saveEdit(todo.id, editInput.value);
                                }
                                if (e.key === 'Escape') {
                                    this.cancelEdit();
                                }
                            });
                            
                            setTimeout(() => editInput.focus(), 0);
                        } else {
                            li.innerHTML = `
                                <input 
                                    type="checkbox" 
                                    class="todo-checkbox"
                                    ${todo.completed ? 'checked' : ''}
                                >
                                <span class="todo-text">${this.escapeHtml(todo.text)}</span>
                                <div class="todo-actions">
                                    <button class="edit-btn">Edit</button>
                                    <button class="delete-btn">Delete</button>
                                </div>
                            `;
                            
                            const checkbox = li.querySelector('.todo-checkbox');
                            const editBtn = li.querySelector('.edit-btn');
                            const deleteBtn = li.querySelector('.delete-btn');
                            
                            checkbox.addEventListener('change', () => {
                                this.toggleTodo(todo.id);
                            });
                            
                            editBtn.addEventListener('click', () => {
                                this.startEdit(todo.id);
                            });
                            
                            deleteBtn.addEventListener('click', () => {
                                if (confirm('Delete this task?')) {
                                    this.deleteTodo(todo.id);
                                }
                            });
                        }
                        
                        todoList.appendChild(li);
                    });
                    
                    const completed = this.todos.filter(t => t.completed).length;
                    const active = this.todos.length - completed;
                    stats.innerHTML = `
                        <strong>${this.todos.length}</strong> total tasks • 
                        <strong>${active}</strong> active • 
                        <strong>${completed}</strong> completed
                    `;
                }
            },

            escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
        };

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            TodoApp.init();
        });
    </script>
</body>
</html>
